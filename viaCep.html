<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consulta de CEP - ViaCEP</title>
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Google Fonts Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    keyframes: {
                        fadeIn: {
                            '0%': { opacity: '0', transform: 'translateY(8px)' },
                            '100%': { opacity: '1', transform: 'translateY(0)' },
                        },
                        highlight: {
                            '0%': { backgroundColor: 'rgba(99, 102, 241, 0.25)', borderColor: 'rgba(99, 102, 241, 0.6)' },
                            '100%': { backgroundColor: 'rgba(30, 41, 59, 0.4)', borderColor: 'rgba(51, 65, 85, 0.6)' },
                        },
                        shake: {
                            '0%, 100%': { transform: 'translateX(0)' },
                            '20%, 60%': { transform: 'translateX(-6px)' },
                            '40%, 80%': { transform: 'translateX(6px)' },
                        }
                    },
                    animation: {
                        fadeIn: 'fadeIn 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards',
                        highlight: 'highlight 1s ease-out forwards',
                        shake: 'shake 0.3s ease-in-out',
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-slate-950 text-slate-100 font-sans min-h-screen flex items-center justify-center p-4 sm:p-6 md:p-8 relative overflow-x-hidden selection:bg-indigo-500 selection:text-white">

    <!-- Orbes Decorativos de Fundo para o Estilo Glassmorphism -->
    <div class="fixed top-1/4 -left-20 w-80 h-80 bg-indigo-600/20 rounded-full blur-[120px] pointer-events-none"></div>
    <div class="fixed bottom-1/4 -right-20 w-80 h-80 bg-purple-600/20 rounded-full blur-[120px] pointer-events-none"></div>

    <!-- Container Principal (Cartão Glassmorphism) -->
    <main class="w-full max-w-xl bg-slate-900/60 backdrop-blur-2xl border border-slate-800/80 rounded-3xl shadow-2xl p-6 sm:p-8 md:p-10 relative z-10 animate-fadeIn">
        
        <!-- Cabeçalho -->
        <header class="mb-8 border-b border-slate-800/60 pb-6 flex items-start justify-between gap-4">
            <div>
                <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-indigo-500/10 border border-indigo-500/20 text-indigo-400 text-xs font-semibold uppercase tracking-wider mb-3">
                    <span class="w-2 h-2 rounded-full bg-indigo-400 animate-pulse"></span>
                    API ViaCEP
                </div>
                <h1 class="text-2xl sm:text-3xl font-bold text-white tracking-tight">Consulta de CEP</h1>
                <p class="text-sm text-slate-400 mt-1">Informe o CEP para obter a localização em tempo real.</p>
            </div>
            
            <div class="p-3 bg-indigo-500/10 rounded-2xl border border-indigo-500/20 text-indigo-400 flex-shrink-0 hidden sm:block">
                <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z" />
                    <path stroke-linecap="round" stroke-linejoin="round" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z" />
                </svg>
            </div>
        </header>

        <!-- Formulário de Consulta -->
        <form id="cep-form" onsubmit="event.preventDefault();" class="space-y-5">
            
            <!-- Campo CEP com Máscara e Loader -->
            <div>
                <div class="flex items-center justify-between mb-2">
                    <label for="cep" class="block text-xs font-semibold uppercase tracking-wider text-slate-300">
                        Código de Endereçamento Postal (CEP)
                    </label>
                    <span id="cep-status-text" class="text-xs text-slate-400 font-normal">Digite 8 dígitos</span>
                </div>

                <div class="relative">
                    <input 
                        type="text" 
                        id="cep" 
                        name="cep" 
                        maxlength="9" 
                        placeholder="00000-000"
                        autocomplete="off"
                        autofocus
                        class="w-full bg-slate-900/90 border border-slate-700/80 rounded-xl px-4 py-3.5 text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition-all font-mono tracking-wider text-base"
                    >
                    
                    <!-- Ícones de Estado (Spinner / Sucesso) -->
                    <div class="absolute right-3.5 top-1/2 -translate-y-1/2 flex items-center gap-2">
                        <!-- Botão Limpar Rápido -->
                        <button 
                            type="button" 
                            id="btn-clear-cep" 
                            onclick="clearForm()" 
                            title="Limpar CEP"
                            class="hidden text-slate-400 hover:text-slate-200 transition-colors p-1"
                        >
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                            </svg>
                        </button>

                        <!-- Spinner de Carregamento -->
                        <div id="cep-spinner" class="hidden">
                            <svg class="animate-spin h-5 w-5 text-indigo-400" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                            </svg>
                        </div>

                        <!-- Ícone de Sucesso -->
                        <div id="cep-success-icon" class="hidden text-emerald-400">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 13l4 4L19 7"></path>
                            </svg>
                        </div>
                    </div>
                </div>

                <!-- Mensagem de Erro Inline -->
                <p id="cep-error-msg" class="text-xs text-rose-400 mt-2 hidden flex items-center gap-1.5 font-medium">
                    <svg class="w-4 h-4 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                    </svg>
                    <span id="cep-error-text">CEP não encontrado.</span>
                </p>
            </div>

            <!-- Divisor Sutil -->
            <div class="border-t border-slate-800/80 my-4"></div>

            <!-- Campos de Endereço (Somente Leitura / Preenchidos Automaticamente) -->
            <div class="space-y-4">
                <!-- Rua / Logradouro -->
                <div>
                    <label for="logradouro" class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1.5">
                        Rua / Avenida (Logradouro)
                    </label>
                    <input 
                        type="text" 
                        id="logradouro" 
                        readonly 
                        placeholder="Aguardando CEP..."
                        class="address-field w-full bg-slate-800/40 border border-slate-800 rounded-xl px-4 py-3 text-slate-300 placeholder-slate-600 focus:outline-none cursor-not-allowed select-none transition-all"
                    >
                </div>

                <!-- Bairro -->
                <div>
                    <label for="bairro" class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1.5">
                        Bairro
                    </label>
                    <input 
                        type="text" 
                        id="bairro" 
                        readonly 
                        placeholder="Aguardando CEP..."
                        class="address-field w-full bg-slate-800/40 border border-slate-800 rounded-xl px-4 py-3 text-slate-300 placeholder-slate-600 focus:outline-none cursor-not-allowed select-none transition-all"
                    >
                </div>

                <!-- Cidade e Estado (UF) em Grid -->
                <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
                    <!-- Cidade -->
                    <div class="sm:col-span-2">
                        <label for="localidade" class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1.5">
                            Cidade
                        </label>
                        <input 
                            type="text" 
                            id="localidade" 
                            readonly 
                            placeholder="Aguardando CEP..."
                            class="address-field w-full bg-slate-800/40 border border-slate-800 rounded-xl px-4 py-3 text-slate-300 placeholder-slate-600 focus:outline-none cursor-not-allowed select-none transition-all"
                        >
                    </div>

                    <!-- Estado (UF) -->
                    <div class="sm:col-span-1">
                        <label for="uf" class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1.5">
                            Estado (UF)
                        </label>
                        <input 
                            type="text" 
                            id="uf" 
                            readonly 
                            placeholder="UF"
                            class="address-field w-full bg-slate-800/40 border border-slate-800 rounded-xl px-3 py-3 text-center uppercase font-semibold text-slate-300 placeholder-slate-600 focus:outline-none cursor-not-allowed select-none transition-all"
                        >
                    </div>
                </div>
            </div>

            <!-- Informações Adicionais Retornadas pela API -->
            <div id="extra-info" class="hidden pt-2">
                <div class="flex items-center justify-around text-xs text-slate-400 bg-indigo-950/20 border border-indigo-500/20 rounded-xl p-3">
                    <div><span class="font-semibold text-indigo-300">DDD:</span> <span id="info-ddd">--</span></div>
                    <div class="border-l border-slate-800 h-3"></div>
                    <div><span class="font-semibold text-indigo-300">Código IBGE:</span> <span id="info-ibge">--</span></div>
                </div>
            </div>

            <!-- Botão Secundário para Limpar Consulta -->
            <div class="pt-2">
                <button 
                    type="button" 
                    onclick="clearForm()"
                    class="w-full py-2.5 rounded-xl border border-slate-800 text-slate-400 hover:text-white hover:bg-slate-800/50 transition-all text-xs font-medium focus:outline-none flex items-center justify-center gap-2"
                >
                    <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path>
                    </svg>
                    Limpar Consulta
                </button>
            </div>
        </form>
    </main>

    <!-- JavaScript da Aplicação -->
    <script>
        // Elementos do DOM
        const cepInput = document.getElementById('cep');
        const logradouroInput = document.getElementById('logradouro');
        const bairroInput = document.getElementById('bairro');
        const localidadeInput = document.getElementById('localidade');
        const ufInput = document.getElementById('uf');
        
        const cepSpinner = document.getElementById('cep-spinner');
        const cepSuccessIcon = document.getElementById('cep-success-icon');
        const cepErrorMsg = document.getElementById('cep-error-msg');
        const cepErrorText = document.getElementById('cep-error-text');
        const cepStatusText = document.getElementById('cep-status-text');
        const btnClearCep = document.getElementById('btn-clear-cep');
        
        const extraInfo = document.getElementById('extra-info');
        const infoDdd = document.getElementById('info-ddd');
        const infoIbge = document.getElementById('info-ibge');

        let lastSearchedCep = '';

        // Evento de digitação com aplicação automática da máscara
        cepInput.addEventListener('input', (e) => {
            let value = e.target.value.replace(/\D/g, ''); // Mantém apenas números

            // Mostra ou esconde botão de limpar
            if (value.length > 0) {
                btnClearCep.classList.remove('hidden');
            } else {
                btnClearCep.classList.add('hidden');
            }

            // Aplica a máscara 00000-000
            if (value.length > 5) {
                value = value.substring(0, 5) + '-' + value.substring(5, 8);
            }
            e.target.value = value;

            const unmasked = value.replace(/\D/g, '');

            // Atualiza status textual
            if (unmasked.length === 8) {
                cepStatusText.textContent = 'Buscando...';
                if (unmasked !== lastSearchedCep) {
                    fetchViaCep(unmasked);
                }
            } else {
                cepStatusText.textContent = `${unmasked.length}/8 dígitos`;
                resetStatus();
                clearAddressFields();
                lastSearchedCep = '';
            }
        });

        // Função de busca na API ViaCEP
        async function fetchViaCep(cleanCep) {
            setLoading(true);
            resetStatus();

            try {
                const response = await fetch(`https://viacep.com.br/ws/${cleanCep}/json/`);
                
                if (!response.ok) {
                    throw new Error("Erro de conexão com o serviço.");
                }

                const data = await response.json();

                // Caso o ViaCEP informe erro
                if (data.erro) {
                    showError("CEP não encontrado no banco de dados.");
                    clearAddressFields();
                    return;
                }

                // Preenche os campos de endereço
                fillAddressFields(data);
                
                // Atualiza visual de sucesso
                cepSuccessIcon.classList.remove('hidden');
                cepInput.classList.add('border-emerald-500/80', 'focus:ring-emerald-500');
                cepStatusText.textContent = 'CEP Localizado';
                cepStatusText.classList.add('text-emerald-400');
                
                lastSearchedCep = cleanCep;

            } catch (error) {
                console.error("Erro no fetch do CEP:", error);
                showError("Falha ao consultar o CEP. Verifique sua conexão.");
                clearAddressFields();
            } finally {
                setLoading(false);
            }
        }

        // Preenchimento dos campos com animação
        function fillAddressFields(data) {
            logradouroInput.value = data.logradouro || 'Não informado';
            bairroInput.value = data.bairro || 'Não informado';
            localidadeInput.value = data.localidade || '';
            ufInput.value = data.uf || '';

            // Animação de destaque visual nos campos preenchidos
            document.querySelectorAll('.address-field').forEach(field => {
                field.classList.remove('animate-highlight');
                // Trigger reflow para reiniciar animação
                void field.offsetWidth;
                field.classList.add('animate-highlight');
            });

            // Exibe DDD e Código IBGE caso existam
            if (data.ddd || data.ibge) {
                infoDdd.textContent = data.ddd || 'N/A';
                infoIbge.textContent = data.ibge || 'N/A';
                extraInfo.classList.remove('hidden');
            } else {
                extraInfo.classList.add('hidden');
            }
        }

        // Limpeza dos campos de endereço
        function clearAddressFields() {
            logradouroInput.value = '';
            bairroInput.value = '';
            localidadeInput.value = '';
            ufInput.value = '';
            extraInfo.classList.add('hidden');
        }

        // Controle do Spinner de Carregamento
        function setLoading(isLoading) {
            if (isLoading) {
                cepSpinner.classList.remove('hidden');
                cepSuccessIcon.classList.add('hidden');
            } else {
                cepSpinner.classList.add('hidden');
            }
        }

        // Exibição de Mensagens de Erro
        function showError(message) {
            cepErrorText.textContent = message;
            cepErrorMsg.classList.remove('hidden');
            cepInput.classList.add('border-rose-500/80', 'focus:ring-rose-500', 'animate-shake');
            cepStatusText.textContent = 'Erro';
            cepStatusText.classList.add('text-rose-400');

            setTimeout(() => {
                cepInput.classList.remove('animate-shake');
            }, 300);
        }

        // Redefinição das bordas e alertas
        function resetStatus() {
            cepErrorMsg.classList.add('hidden');
            cepSuccessIcon.classList.add('hidden');
            cepStatusText.classList.remove('text-emerald-400', 'text-rose-400');
            cepInput.classList.remove(
                'border-rose-500/80', 'focus:ring-rose-500', 
                'border-emerald-500/80', 'focus:ring-emerald-500'
            );
        }

        // Função de Limpeza Geral
        function clearForm() {
            cepInput.value = '';
            lastSearchedCep = '';
            resetStatus();
            clearAddressFields();
            setLoading(false);
            btnClearCep.classList.add('hidden');
            cepStatusText.textContent = 'Digite 8 dígitos';
            cepInput.focus();
        }
    </script>
</body>
</html>
